<html lang="en">
<head>

<!--
  ══════════════════════════════════════════════════════════════════════
   OUR UNIVERSE · 3D  —  a love story you travel through.

   One scroll / drag / arrow-key = one milestone. The camera flies there
   and settles: the cosmic object appears, its title sweeps up, and the
   memories fade in as framed cards. Tap a card to open its slideshow.

   ── MAKE IT YOURS ────────────────────────────────────────────────────
   Edit the MILESTONES array (words + photos).
   Real photo:  photos:[ { src:"https://.../pic.jpg", caption:"..." } ]
   Needs internet on first open (loads Three.js) and a capable device.
  ══════════════════════════════════════════════════════════════════════
-->

<style>
  :root{ --ink:#eef1ff; --dim:#9aa2d0; --gold:#f6dca4; --gold-hot:#fff7e6; --rose:#e9b6cf; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#04040f; color:var(--ink); font-family:'Karla',system-ui,sans-serif; }
  canvas{ display:block; position:fixed; inset:0; z-index:0; touch-action:none; }
  #rail{ position:fixed; top:0; left:0; height:3px; width:0%; z-index:60; background:linear-gradient(90deg,var(--gold),var(--rose)); box-shadow:0 0 12px rgba(246,220,164,.6); transition:width .8s ease; }

  #dotsNav{ position:fixed; top:50%; right:22px; transform:translateY(-50%); z-index:30; display:flex; flex-direction:column; gap:12px; }
  #dotsNav b{ width:9px; height:9px; border-radius:50%; background:rgba(205,214,255,.28); cursor:pointer; transition:all .35s ease; }
  #dotsNav b.on{ background:var(--gold); box-shadow:0 0 12px var(--gold); height:26px; border-radius:5px; }

  #announce{ position:fixed; top:12vh; left:0; right:0; z-index:25; text-align:center; pointer-events:none; opacity:0; transform:translateY(-18px); transition:opacity .7s ease, transform .7s ease; }
  #announce.on{ opacity:1; transform:none; }
  #announce .era{ font-size:12px; letter-spacing:6px; text-transform:uppercase; color:var(--gold); margin-bottom:12px; }
  #announce .title{ font-family:'Cormorant Garamond',serif; font-weight:400; font-size:clamp(34px,6vw,62px); color:var(--gold-hot); line-height:1.05; text-shadow:0 0 44px rgba(246,220,164,.4); padding:0 16px; }

  #hud{ position:fixed; left:6vw; bottom:9vh; z-index:20; max-width:min(420px,82vw); opacity:0; transform:translateY(16px); transition:opacity .7s ease, transform .7s ease; pointer-events:none; }
  #hud.on{ opacity:1; transform:none; }
  #hud .story{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(17px,2.6vw,22px); color:var(--rose); }
  #hud .explain{ font-size:14px; line-height:1.7; color:var(--ink); opacity:.85; margin-top:8px; }
  #hud .hint{ margin-top:12px; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); display:inline-flex; align-items:center; gap:8px; }
  #hud .hint .orb{ width:8px; height:8px; border-radius:50%; background:var(--gold-hot); box-shadow:0 0 10px var(--gold-hot); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.6);opacity:.5;} }

  #nav{ position:fixed; left:50%; bottom:4.5vh; transform:translateX(-50%); z-index:20; display:flex; gap:14px; }
  #nav button{ min-width:118px; padding:12px 20px; border-radius:100px; border:1px solid rgba(246,220,164,.4); background:rgba(20,18,50,.45); backdrop-filter:blur(6px); color:var(--gold-hot); font-size:11px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:background .25s ease, transform .2s ease; }
  #nav button:hover{ background:rgba(246,220,164,.16); transform:translateY(-2px); }
  #nav button:disabled{ opacity:.3; cursor:default; transform:none; }

  #intro{ position:fixed; inset:0; z-index:40; display:grid; place-items:center; text-align:center; padding:24px; background:radial-gradient(circle at 50% 45%, rgba(30,20,70,.5), rgba(4,4,15,.98)); transition:opacity 1.4s ease; }
  #intro.gone{ opacity:0; pointer-events:none; }
  #intro .eyebrow{ font-size:12px; letter-spacing:6px; text-transform:uppercase; color:var(--dim); margin-bottom:24px; }
  #intro h1{ font-family:'Cormorant Garamond',serif; font-weight:300; line-height:1.05; font-size:clamp(38px,8vw,74px); color:var(--gold-hot); text-shadow:0 0 50px rgba(246,220,164,.35); }
  #intro h1 em{ font-style:italic; color:var(--rose); }
  #intro p{ margin-top:22px; color:var(--dim); font-size:15px; line-height:1.7; }
  .begin{ margin-top:40px; cursor:pointer; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:#04040f; background:linear-gradient(180deg,var(--gold-hot),var(--gold)); border:none; padding:15px 42px; border-radius:100px; box-shadow:0 0 44px rgba(246,220,164,.4); transition:transform .2s ease; }
  .begin:hover{ transform:translateY(-2px); } .begin:disabled{ opacity:.6; cursor:default; }
  #loading{ margin-top:26px; font-size:12px; letter-spacing:2px; color:var(--dim); }

  #show{ position:fixed; inset:0; z-index:70; background:rgba(3,3,12,.9); backdrop-filter:blur(8px); display:grid; place-items:center; opacity:0; pointer-events:none; transition:opacity .5s ease; padding:20px; }
  #show.on{ opacity:1; pointer-events:auto; }
  .show-inner{ width:min(680px,94vw); max-height:94vh; }
  .show-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .show-era{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:22px; color:var(--rose); }
  .show-x{ width:40px; height:40px; border-radius:50%; border:1px solid rgba(205,214,255,.25); background:rgba(20,20,50,.5); color:var(--ink); font-size:18px; cursor:pointer; transition:transform .2s ease, background .2s ease; }
  .show-x:hover{ transform:rotate(90deg); background:rgba(20,20,50,.9); }
  .show-stage{ position:relative; aspect-ratio:3/2; max-height:64vh; border-radius:18px; overflow:hidden; background:#0c0c22; border:1px solid rgba(233,182,207,.28); box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 70px rgba(120,90,180,.2); }
  .slide{ position:absolute; inset:0; opacity:0; transition:opacity .7s ease; } .slide.cur{ opacity:1; }
  .slide img{ width:100%; height:100%; object-fit:cover; }
  .slide .cap{ position:absolute; left:0; right:0; bottom:0; padding:40px 22px 18px; background:linear-gradient(transparent, rgba(4,4,15,.85)); font-family:'Cormorant Garamond',serif; font-style:italic; font-size:19px; color:var(--gold-hot); }
  .nav2{ position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%; border:none; background:rgba(4,4,15,.5); color:#fff; font-size:22px; cursor:pointer; } .nav2:hover{ background:rgba(4,4,15,.85); } .nav2.prev{ left:12px; } .nav2.next{ right:12px; }
  .dots{ display:flex; justify-content:center; gap:8px; margin-top:16px; } .dots b{ width:8px; height:8px; border-radius:50%; background:rgba(205,214,255,.3); cursor:pointer; transition:all .3s ease; } .dots b.on{ background:var(--gold); width:22px; border-radius:4px; }
  .strip{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; max-width:100%; scrollbar-width:thin; }
  .strip::-webkit-scrollbar{ height:5px; }
  .strip::-webkit-scrollbar-thumb{ background:rgba(246,220,164,.35); border-radius:3px; }
  .sthumb{ flex:0 0 auto; width:58px; height:40px; padding:0; border:none; background:none; cursor:pointer; }
  .sthumb img{ width:100%; height:100%; object-fit:cover; border-radius:6px; display:block;
    border:1px solid rgba(205,214,255,.22); opacity:.5; transition:opacity .25s ease, border-color .25s ease, transform .2s ease; }
  .sthumb:hover img{ opacity:.85; transform:translateY(-2px); }
  .sthumb.on img{ opacity:1; border-color:rgba(246,220,164,.95); box-shadow:0 0 14px rgba(246,220,164,.35); }
  .cap .when{ display:block; margin-top:4px; font-family:'Karla',sans-serif; font-style:normal;
    font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--rose); opacity:.85; }
  .counter{ margin-top:8px; font-size:11px; letter-spacing:2px; color:var(--dim); text-align:center; }
  .show-foot{ text-align:center; margin-top:14px; } .auto{ background:none; border:none; color:var(--dim); font-size:11px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; } .auto:hover{ color:var(--gold); }

  #finale{ position:fixed; inset:0; z-index:35; display:grid; place-items:center; text-align:center; padding:24px; background:radial-gradient(circle at 50% 45%, rgba(30,20,70,.4), rgba(4,4,15,.82)); opacity:0; pointer-events:none; transition:opacity 1.2s ease; }
  #finale.on{ opacity:1; pointer-events:auto; }
  #finale .cosmic{ font-family:'Cormorant Garamond',serif; font-size:clamp(34px,6.5vw,60px); color:var(--gold-hot); text-shadow:0 0 40px rgba(246,220,164,.35); }
  #finale p{ max-width:600px; margin:16px auto 0; font-size:17px; line-height:1.7; color:var(--ink); opacity:.9; }
  .replay{ margin-top:30px; cursor:pointer; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:#04040f; background:linear-gradient(180deg,var(--gold-hot),var(--gold)); border:none; padding:14px 34px; border-radius:100px; box-shadow:0 0 40px rgba(246,220,164,.4); }
</style>
</head>
<body>

<div id="rail"></div>
<div id="dotsNav"></div>
<div id="announce"><div class="era" id="aEra"></div><div class="title" id="aTitle"></div></div>
<div id="hud"><div class="story" id="hStory"></div><div class="explain" id="hExplain"></div><div class="hint"><span class="orb"></span>Follow the firefly — memories gather where it rests</div></div>
<div id="nav"><button id="navPrev">← Back</button><button id="navNext">Next →</button></div>

<div id="intro"><div>
  <div class="eyebrow">A history of everything · in 3D</div>
  <h1>Before you, there was <em>nothing</em>.</h1>
  <p>Then — everything. Move forward one moment at a time,<br/>and reach out to the memories waiting in the dark.</p>
  <button class="begin" id="beginBtn" disabled>Preparing the cosmos…</button>
  <div id="loading">loading the universe ✦</div>
</div></div>

<div id="show" role="dialog" aria-modal="true"><div class="show-inner">
  <div class="show-head"><div class="show-era" id="showEra"></div><button class="show-x" id="showX" aria-label="Close">✕</button></div>
  <div class="show-stage" id="showStage"></div>
  <div class="dots" id="showDots"></div>
  <div class="show-foot"><button class="auto" id="showAuto">▶ Auto-play</button></div>
</div></div>

<div id="finale"><div>
  <div class="cosmic" id="finTitle"></div><p id="finText"></p>
  <button class="replay" id="replayBtn">Relive it ✦</button>
</div></div>

<script src="photos.js"></script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ══════════════════════════════════════════════════════════════════════
   THE STORY — edit freely. (scene names drive the 3D object; keep them.)
   ══════════════════════════════════════════════════════════════════════ */
const MILESTONES = [
  { scene:"bigbang", era:"13.8 billion years ago", title:"The Big Bang", subtitle:"the moment we met",
    explanation:"Out of nothing, a whole universe — that was you walking into my life.",
    photos:[ {caption:"The day our paths first crossed"},{caption:"The first photo of us"},{caption:"Before we knew what this would become"} ] },
  { scene:"stars", era:"The first light", title:"The First Stars Ignite", subtitle:"falling for each other",
    explanation:"The first stars flickered awake in the dark — and so did we.",
    photos:[ {caption:"Our first proper date"},{caption:"Talking until sunrise"},{caption:"Learning each other by heart"} ] },
  { scene:"solar", era:"Order from the dust", title:"A Solar System Forms", subtitle:"us, becoming an 'us'",
    explanation:"Two lives found a shared centre of gravity, and began to orbit it.",
    photos:[ {caption:"Our first trip together"},{caption:"The day I knew"},{caption:"Meeting the families"} ] },
  { scene:"earth", era:"A pale blue dot", title:"Earth Comes Alive", subtitle:"building a world together",
    explanation:"Oceans, then continents — a living world. We built ours too.",
    photos:[ {caption:"The first place that was ours"},{caption:"Sunday mornings"},{caption:"Home is wherever you are"} ] },
  { scene:"garden", era:"The age of flowers", title:"Gardens Bloom", subtitle:"our wedding",
    explanation:"The planet burst into flower — its most beautiful age. So did we.",
    photos:[ {caption:"The day we said 'I do'"},{caption:"Our first dance"},{caption:"Everyone we love"} ] },
  { scene:"life", era:"Life awakens", title:"A New Life Takes Root", subtitle:"Manan is born", /* ★ MANAN ★ */
    explanation:"In the garden we grew together, something small and new took root — and our whole world made room for him.",
    photos:[ {caption:"The first time we held him"},{caption:"Ten tiny fingers"},{caption:"Our little universe, complete"} ] },
  { scene:"seasons", era:"All the years ahead", title:"The Seasons Turn", subtitle:"the life we're still growing",
    explanation:"Day after night, spring after spring — the garden keeps turning, and the little tree grows tall beside ours.",
    photos:[ {caption:"Everywhere we'll go"},{caption:"All the birthdays to come"},{caption:"The rest of our story"} ] },
];
/* ══════════════════════════════════════════════════════════════════════
   YOUR PHOTOS
   Run build-photos.py to generate photos.js, then paste the folder list it
   prints into STAGE_FOLDERS below — one folder per stage, in story order.
   Leave a slot as "" and that stage falls back to placeholders.
   ══════════════════════════════════════════════════════════════════════ */
const PHOTO_ROOT = "photos/";     // folder location, relative to this file
const STAGE_FOLDERS = [
  "",   // 1 · The Big Bang        — we met
  "",   // 2 · The First Stars     — falling for each other
  "",   // 3 · A Solar System      — becoming an us
  "",   // 4 · Earth Comes Alive   — building a world
  "",   // 5 · Gardens Bloom       — our wedding
  "",   // 6 · A New Life          — Manan
  "",   // 7 · The Seasons Turn    — the years ahead
];
const FRAMES_PER_STAGE = 3;   // how many gathering places each scene has
const ROTATE_EVERY     = 11;  // seconds a frame keeps a photo before swapping

const FINALE = { title:"And it's still beginning.", text:"Every star that ever burned, every spring that ever came — all of it, just to arrive at you. Happy birthday, my love. Here's to every season still ahead of us." };
const N=MILESTONES.length;
/* turn the manifest into a photo pool for each stage */
(function buildPools(){
  const man=(typeof window!=='undefined' && window.OUR_UNIVERSE_PHOTOS)||null;
  const folders=man?Object.keys(man):[];
  /* filenames with spaces, &, #, ? or + must be escaped or the browser can't fetch them */
  const enc=p=>p.split('/').map(encodeURIComponent).join('/');
  const rootEnc=PHOTO_ROOT.split('/').filter(Boolean).map(encodeURIComponent).join('/')+'/';
  const pretty=f=>{ let s=f.replace(/\.[^.]+$/,'').replace(/^[\d\s._-]+/,'').replace(/[_-]+/g,' ').trim();
    if(!s || /^(img|dsc|pxl|photo|image|screenshot)\b/i.test(s) || /^\d+$/.test(s)) return '';
    return s.charAt(0).toUpperCase()+s.slice(1); };
  const report=[];
  MILESTONES.forEach((m,i)=>{
    let key=STAGE_FOLDERS[i], how='named';
    if((!key || !man || !man[key]) && man){ key=folders[i]; how='by order'; }
    const list=(man && key && man[key])||null;
    if(list && list.length){
      m.pool=list.map(e=>{
        const o=(typeof e==='string')?{p:e}:e;          /* older manifests were plain strings */
        const raw=o.p||'';
        return { src:(raw.startsWith('data:')?raw:rootEnc+enc(raw)),
                 caption:(o.c!==undefined?o.c:pretty(raw.split('/').pop())),
                 date:o.d||'', dateLabel:o.dl||'', origin:o.o||'',
                 order:(o.n!==undefined?o.n:(o.x!==undefined?o.x:null)) };
      });
      /* keep the generator's order: your number prefixes first, date as fallback */
      if(m.pool.every(p=>p.order!==null&&p.order!==undefined)) m.pool.sort((a,b)=>a.order-b.order);
      else if(m.pool.every(p=>p.date)) m.pool.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
      const span=m.pool.length&&m.pool[0].dateLabel
        ? m.pool[0].dateLabel+' → '+m.pool[m.pool.length-1].dateLabel : '';
      report.push({stage:i+1, folder:key, photos:list.length, matched:how, span});
    } else {
      m.pool=m.photos.slice();
      report.push({stage:i+1, folder:key||'—', photos:0, matched:'PLACEHOLDERS'});
    }
  });
  /* say plainly what happened, instead of failing silently */
  const missing=report.filter(r=>r.matched==='PLACEHOLDERS');
  const build=(typeof window!=='undefined' && window.OUR_UNIVERSE_BUILD)||null;
  const firstSrc=(MILESTONES.find(x=>x.pool&&x.pool.length)||{pool:[{}]}).pool[0].src||'';
  const embedded=firstSrc.startsWith('data:');
  console.log('%c Our Universe — photo check ','background:#f6dca4;color:#04040f;font-weight:bold');
  console.log('page opened over :', location.protocol, embedded?'| photos are EMBEDDED':'| photos are FILE PATHS');
  console.log('photos.js built  :', build?(build.at+'  mode='+build.mode+'  '+build.count+' photos'):'(no build stamp — old photos.js)');
  console.table(report);
  /* opened straight from disk with path-based photos: the frames cannot work */
  if(location.protocol==='file:' && man && !embedded){
    addEventListener('DOMContentLoaded',()=>needInline(build));
  }
  if(!man) console.warn('photos.js did not load. Is it beside this HTML file, and are you serving over http:// rather than opening the file directly?');
  else if(missing.length) console.warn(missing.length+' stage(s) have no photos — check STAGE_FOLDERS against these folder names:', folders);
  if(!man || missing.length){
    addEventListener('DOMContentLoaded',()=>{
      const b=document.createElement('div');
      b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;padding:10px 16px;'+
        'background:rgba(120,30,40,.92);color:#ffe9d0;font:12px/1.5 system-ui;text-align:center';
      b.textContent = !man
        ? 'photos.js not loaded — placeholders are showing. Run build-photos.py, keep photos.js beside this file, and serve it with:  python3 -m http.server 8000'
        : missing.length+' stage(s) showing placeholders. Open the console for the folder list, then fix STAGE_FOLDERS.';
      const x=document.createElement('span'); x.textContent=' ✕'; x.style.cssText='cursor:pointer;font-weight:bold;margin-left:12px';
      x.onclick=()=>b.remove(); b.appendChild(x); document.body.appendChild(b);
    });
  }
})();
const FRAME={ bigbang:{d:78,h:5}, stars:{d:66,h:4}, solar:{d:86,h:16}, earth:{d:42,h:4}, garden:{d:58,h:13}, life:{d:42,h:10}, galaxy:{d:100,h:34}, seasons:{d:46,h:11} };

/* per-era background weights */
const BG={
  star:[0,1,.9,0,0,.12,0], gal:[0,.9,.35,0,0,0,0], eSky:[0,0,0,1,.15,0,0], gSky:[0,0,0,.12,1,1,0], dSky:[0,0,0,0,0,0,0]
};

function placeholderURL(mi,pi,label){
  const c=document.createElement('canvas'); c.width=600; c.height=400; const x=c.getContext('2d');
  const hues=[268,300,205,150,330,45,255]; const h=(hues[mi%hues.length]+pi*16)%360;
  const g=x.createRadialGradient(240,140,20,300,200,420);
  g.addColorStop(0,`hsl(${h},55%,46%)`); g.addColorStop(.6,`hsl(${h+16},50%,26%)`); g.addColorStop(1,`hsl(${h+28},60%,9%)`);
  x.fillStyle=g; x.fillRect(0,0,600,400);
  x.fillStyle='rgba(255,247,230,.6)'; x.font='italic 30px Georgia'; x.textAlign='center'; x.fillText('your photo here',300,196);
  x.fillStyle='rgba(255,247,230,.34)'; x.font='17px Georgia'; x.fillText(label||'',300,228);
  return c.toDataURL('image/png');
}
MILESTONES.forEach((m,i)=>m.photos.forEach((p,pi)=>{ if(!p.src) p.src=placeholderURL(i,pi,p.caption); }));

/* ══════════════════════════════════════════════════════════════════════
   RENDER SETUP
   ══════════════════════════════════════════════════════════════════════ */
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const renderer=new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 6000);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.55, 0.6, 0.32);
composer.addPass(bloom); composer.addPass(new OutputPass());

const ambient=new THREE.AmbientLight(0x2a3358,0.55); scene.add(ambient);
const sunLight=new THREE.DirectionalLight(0xfff2d8,1.8); sunLight.position.set(60,30,50); scene.add(sunLight);

const TAU=Math.PI*2;
const clamp01=x=>Math.min(1,Math.max(0,x));
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5);

/* ── texture kitchen: everything procedural, layered, soft ───────────── */
function canvasTex(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }

/* value-noise + fBm for planet surfaces */
function makeNoise(seed){ const p=new Uint8Array(512); const rnd=(function(){ let s=seed; return ()=>((s=(Math.imul(48271,s)>>>0)%2147483647)/2147483647); })();
  for(let i=0;i<256;i++)p[i]=i; for(let i=255;i>0;i--){ const j=(rnd()*(i+1))|0; [p[i],p[j]]=[p[j],p[i]]; } for(let i=0;i<256;i++)p[i+256]=p[i];
  const fade=t=>t*t*(3-2*t);
  function n2(x,y){ const X=Math.floor(x)&255, Y=Math.floor(y)&255; x-=Math.floor(x); y-=Math.floor(y);
    const u=fade(x), v=fade(y);
    const a=p[p[X]+Y]/255, b=p[p[X+1]+Y]/255, c=p[p[X]+Y+1]/255, d=p[p[X+1]+Y+1]/255;
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
  return (x,y,oct)=>{ let f=0,amp=0.5,fr=1; for(let o=0;o<oct;o++){ f+=amp*n2(x*fr,y*fr); amp*=0.5; fr*=2; } return f; };
}
function earthTexture(){ const noise=makeNoise(1337);
  return canvasTex(1024,512,(x,w,h)=>{ const img=x.createImageData(w,h); const d=img.data;
    for(let j=0;j<h;j++){ const lat=Math.abs(j/h-0.5)*2;
      for(let i=0;i<w;i++){ const u=i/w, v=j/h;
        /* wrap noise horizontally for a seamless sphere */
        const ang=u*TAU; const nx=Math.cos(ang)*1.6+2, ny=Math.sin(ang)*1.6+2;
        let e=noise(nx+v*0.001, ny+v*3.2, 5);            // continents
        e += (noise(nx*2.7, ny*2.7+v*6.4, 4)-0.5)*0.25;  // coast detail
        const iceLat=0.86+noise(nx*3,ny*3,2)*0.06;
        const k=(j*w+i)*4; let r,g,b2;
        if(lat>iceLat){ r=235;g=242;b2=248; }             // polar ice
        else if(e<0.47){ const dp=Math.max(0,(0.47-e))*3; r=18+10*(1-dp); g=52+26*(1-dp); b2=110+40*(1-dp); } // ocean
        else if(e<0.50){ r=194;g=178;b2=128; }            // shore
        else { const hgt=(e-0.5)*3.4; const lush=noise(nx*1.7+9,ny*1.7+9,3);
          if(hgt>0.72){ r=142;g=132;b2=120; }            // mountains
          else if(lush>0.55){ r=46;g=98+30*lush;b2=52; } // forest
          else { r=96;g=112;b2=58; } }                    // plains
        d[k]=r; d[k+1]=g; d[k+2]=b2; d[k+3]=255; } }
    x.putImageData(img,0,0); }); }

function atmosphere(radius,color,intensity){
  const mat=new THREE.ShaderMaterial({
    transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false,
    uniforms:{ c:{value:new THREE.Color(color)}, k:{value:intensity} },
    vertexShader:`varying vec3 vN; varying vec3 vP; void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.0); vP=mv.xyz; gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 c; uniform float k; varying vec3 vN; varying vec3 vP;
      void main(){ float f=pow(1.0-abs(dot(normalize(vN),normalize(-vP))),2.2); gl_FragColor=vec4(c, f*k); }`
  });
  return new THREE.Mesh(new THREE.SphereGeometry(radius,48,48), mat);
}

  grp.position.set(A.x+p0[0]+jit*2.5, A.y+p0[1]+jit*1.8, A.z+p0[2]+jit*2.5);
  grp.renderOrder=3; scene.add(grp);

    const moon=sprite(GLOW_TIGHT,0xf2f6ff,0); moon.scale.setScalar(60); g.add(moon);

    /* ── light ── */
    const hemi=new THREE.HemisphereLight(0xcfe6ff,0x3f6b3a,0.95); g.add(hemi);

    /* ── the lawn ── */
    const geo=new THREE.PlaneGeometry(420,300,90,64); geo.rotateX(-Math.PI/2);

    /* ── flower beds ── */
    function bedField(count,rMin,rMax,cols,size){
      const pos=new Float32Array(count*3), col=new Float32Array(count*3); const c=new THREE.Color();
      for(let k=0;k<count;k++){ const a=Math.random()*TAU; const r=rMin+Math.random()*(rMax-rMin);

        pos[k*3]=x2; pos[k*3+1]=gY(x2,z2)+0.35+Math.random()*0.5; pos[k*3+2]=z2;
        c.set(cols[(Math.random()*cols.length)|0]); col[k*3]=c.r; col[k*3+1]=c.g; col[k*3+2]=c.b; }
      const gm=new THREE.BufferGeometry(); gm.setAttribute('position',new THREE.BufferAttribute(pos,3)); gm.setAttribute('color',new THREE.BufferAttribute(col,3));
      const pts=new THREE.Points(gm,new THREE.PointsMaterial({size,map:FLOWER_TEX,vertexColors:true,transparent:true,alphaTest:0.4,sizeAttenuation:true,depthWrite:true}));
      pts.position.y=-2.3; g.add(pts); return {pts,base:size}; }
    const beds=[
      bedField(700, 18,30,[0xff5f7a,0xff9a3c,0xffd93c,0xffffff],0.9),
      bedField(700, 30,46,[0xf2569a,0xc86ede,0xffffff,0xff8f5f],0.85),
      bedField(600, 46,64,[0xffd93c,0xff6f4a,0xf070a8,0xffffff],0.8),
      bedField(500, 64,86,[0xff5f7a,0xffd93c,0xffffff,0xc86ede],0.75),
      bedField(420, 5,18,[0xffffff,0xffe27a,0xff9ec4,0xd9a0ff],0.5),
    ];

    /* ── tree builder: leaf tiers and blossom tiers kept separate ── */
    const barkMat=new THREE.MeshStandardMaterial({color:0x6b4a33,roughness:1});
    const tierGeo=new THREE.SphereGeometry(1,20,12);
    function blossomTree(px,pz,S){
      const tr=new THREE.Group(); tr.position.set(px,gY(px,pz)-2.4,pz); tr.scale.setScalar(S); g.add(tr);
      const trunkG=new THREE.Group(); tr.add(trunkG);
      let ty=0, lx=0;
      [[0.62,0.5,2.4,0.14],[0.5,0.38,2.2,-0.10],[0.38,0.28,2.0,0.18],[0.28,0.19,1.7,-0.12]]
        .forEach(sg=>{ const seg=new THREE.Mesh(new THREE.CylinderGeometry(sg[1],sg[0],sg[2],10),barkMat);
          seg.position.set(lx,ty+sg[2]/2,0); seg.rotation.z=sg[3]; trunkG.add(seg);
          lx+=Math.sin(sg[3])*sg[2]*0.85; ty+=sg[2]*0.94; });
      for(let k=0;k<6;k++){ const a=k/6*TAU; const rg=new THREE.CylinderGeometry(0.09,0.3,1.5,6); rg.translate(0,0.75,0);
        const rt=new THREE.Mesh(rg,barkMat); rt.position.set(Math.cos(a)*0.42,0,Math.sin(a)*0.42);
        rt.rotation.z=Math.cos(a)*1.2; rt.rotation.x=-Math.sin(a)*1.2; trunkG.add(rt); }
      [[3.2,0.4,-1.15,3.6],[4.0,-2.5,-1.0,3.2],[4.8,2.3,-1.2,3.8],[5.6,-0.8,-0.95,2.8],[6.2,3.4,-1.05,2.5]]
        .forEach(ld=>{ const bl=ld[3]; const bg=new THREE.CylinderGeometry(0.07,0.2,bl,7); bg.translate(0,bl/2,0);
          const br=new THREE.Mesh(bg,barkMat); br.position.set(lx*0.5,ld[0],0); br.rotation.y=ld[1]; br.rotation.z=ld[2]; trunkG.add(br);
          for(let q=0;q<2;q++){ const tl=1.2+Math.random()*1.2; const tg2=new THREE.CylinderGeometry(0.04,0.1,tl,5); tg2.translate(0,tl/2,0);
            const tw=new THREE.Mesh(tg2,barkMat);
            tw.position.set(lx*0.5+Math.sin(ld[1])*bl*0.6, ld[0]+Math.cos(ld[2])*bl*0.55, Math.cos(ld[1])*bl*0.5);
            tw.rotation.set(gauss()*0.6,Math.random()*TAU,ld[2]*0.8+gauss()*0.4); trunkG.add(tw); } });
      const leafT=[], blosT=[];
      function tier(x2,y2,z2,rx,ry,rot,list){ const m2=new THREE.Mesh(tierGeo,new THREE.MeshStandardMaterial({color:0x4a9a4e,roughness:1}));
        m2.position.set(x2,y2,z2); m2.rotation.y=rot||0; m2.userData.bs=new THREE.Vector3(rx,ry,rx*0.92);
        m2.scale.copy(m2.userData.bs); trunkG.add(m2); list.push(m2); }
      tier(-2.7,3.7,0.4, 3.1,0.52,0.3,leafT); tier(3.1,4.2,-0.6, 3.3,0.54,1.1,leafT);
      tier(-3.5,5.2,-0.8, 2.8,0.48,2.0,leafT); tier(2.5,5.8,1.0, 2.7,0.48,0.7,leafT);
      tier(-0.4,6.6,-0.2, 3.2,0.52,1.6,leafT);
      tier(0.6,7.7,0.2, 3.1,0.64,0.4,blosT); tier(-1.9,8.4,-0.4, 2.5,0.58,1.3,blosT);
      tier(2.1,8.7,0.6, 2.3,0.54,2.2,blosT); tier(0.2,9.4,-0.2, 2.0,0.52,0.9,blosT);
      const blooms=[]; for(let k=0;k<130;k++){ const s=sprite(PETAL_TEX,[0xf2b3ce,0xf6c9da,0xe89cbb,0xfad9e6][k%4],0);
        const a=Math.random()*TAU, r=Math.random()*3.3;
        s.position.set(Math.cos(a)*r+0.4, 7.4+Math.random()*2.3, Math.sin(a)*r*0.9);
        s.scale.setScalar(0.42+Math.random()*0.45); s.material.rotation=Math.random()*TAU; trunkG.add(s); blooms.push(s); }
      return {tr,trunkG,leafT,blosT,blooms}; }

    const great=blossomTree(-10,-4, 2.05);
    const far=blossomTree(18,-24, 1.5);
    const sapling=blossomTree(4.5,2.0, 0.55);

    /* ── distant hills + treeline ── */
    const farCanopies=[];
    for(let k=0;k<7;k++){ const a=-0.5-k*0.42+gauss()*0.1; const r=210+Math.random()*130;
      const hill=new THREE.Mesh(new THREE.SphereGeometry(52+Math.random()*40,20,12),
        new THREE.MeshStandardMaterial({color:0x8aa88a,roughness:1}));
      hill.position.set(Math.cos(a)*r,-32-Math.random()*14,-Math.abs(Math.sin(a))*r-90); hill.scale.y=0.42; g.add(hill); farCanopies.push(hill); }
    for(let k=0;k<26;k++){ const a=(k/26)*Math.PI*1.7-Math.PI*0.85+gauss()*0.05; const r=100+Math.random()*70;
      const tx=Math.cos(a)*r, tz=-Math.abs(Math.sin(a))*r-24;
      const ft=new THREE.Group(); ft.position.set(tx,gY(tx,tz)-2.4,tz); ft.scale.setScalar(3.0+Math.random()*3.2);
      const trm=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.2,1.5,6),new THREE.MeshStandardMaterial({color:0x5a4030,roughness:1})); trm.position.y=0.75; ft.add(trm);
      const c1=new THREE.Mesh(new THREE.SphereGeometry(1.15,10,9),new THREE.MeshStandardMaterial({color:0x4a8a52,roughness:1})); c1.position.y=2.0; c1.scale.y=1.2; ft.add(c1); farCanopies.push(c1);
      const c2b=new THREE.Mesh(new THREE.SphereGeometry(0.8,10,9),new THREE.MeshStandardMaterial({color:0x4a8a52,roughness:1})); c2b.position.set(0.7,1.6,0.2); ft.add(c2b); farCanopies.push(c2b);
      g.add(ft); }

    /* ── what falls through the air, one set per season ── */
    function faller(tex,cols,n,scMin,scRng,speed,drift){
      const arr=[]; for(let k=0;k<n;k++){ const s=sprite(tex,cols[k%cols.length],0);
        s.material.blending=THREE.NormalBlending; s.material.depthWrite=false;
        s.userData={x:-30+Math.random()*60, z:-20+Math.random()*44, off:Math.random(),
          sp:speed*(0.75+Math.random()*0.5), rot:Math.random()*TAU, rs:(Math.random()-0.5)*drift, dr:drift};
        s.scale.setScalar(scMin+Math.random()*scRng); g.add(s); arr.push(s); }
      return arr; }
    const petals=faller(PETAL_TEX,[0xf6a8c8,0xfad9e6,0xf2b3ce],70,0.34,0.4,0.035,1.0);
    const leaves=faller(LEAF_TEX,[0xe8a13c,0xd9682f,0xf2c451,0xb8541f],70,0.5,0.5,0.03,1.4);
    const snow=faller(SNOW_TEX,[0xffffff,0xf2f8ff],110,0.28,0.3,0.022,0.4);

    /* ── butterflies in the warm seasons ── */
    const flut=[]; for(let k=0;k<7;k++){ const b=new THREE.Group();
      const wc=[0xffc45a,0xff8ec0,0x9ad4ff,0xdcaaff,0xa8f0c0][k%5];
      const wG=new THREE.CircleGeometry(0.3,12,0,Math.PI);
      const w1=new THREE.Mesh(wG,new THREE.MeshBasicMaterial({color:wc,side:THREE.DoubleSide,transparent:true,opacity:0}));
      const w2=new THREE.Mesh(wG,new THREE.MeshBasicMaterial({color:wc,side:THREE.DoubleSide,transparent:true,opacity:0}));
      w1.rotation.z=Math.PI/2; w2.rotation.z=-Math.PI/2; b.add(w1); b.add(w2);
      const gl=sprite(GLOW_SOFT,wc,0); gl.scale.setScalar(2.4); b.add(gl);
      b.userData={w1,w2,gl, ph:k/7*TAU+Math.random()*0.5, rad:4+Math.random()*6,
        yb:1.6+Math.random()*3, ySw:0.5+Math.random()*0.8, yOff:Math.random()*TAU, spd:0.3+Math.random()*0.2, tilt:gauss()*0.25};
      g.add(b); flut.push(b); }

    /* ── season keyframes: spring · summer · autumn · winter ── */
    const K={
      leaf:  ['#8fce63','#3f8a45','#e08a2a','#7a6a58'],
      blos:  ['#f2a8c8','#4f9f52','#d9682f','#8a7a68'],
      leafSc:[0.92,1.12,0.98,0.05],
      blosSc:[1.05,1.05,0.9,0.05],
      bloom: [0.95,0.0,0.0,0.0],
      ground:['#9fd08a','#8fc47a','#cfae62','#eef6fb'],
      bed:   [0.9,1.0,0.3,0.0],
      skyTop:['#3f8ad0','#2f7ec8','#c98a4a','#96a8bc'],
      skyBot:['#dff0fb','#cfe8f8','#f6d9a8','#e2eaf2'],
      lightC:['#fff4dc','#fffbe8','#ffd9a0','#dae6f4'],
      lightI:[1.5,1.72,1.28,0.88],
      hemiI: [0.95,1.0,0.85,0.7],
      far:   ['#7fb46a','#4a8a52','#c2894a','#dfe9f2'],
      pet:   [1,0.12,0,0], lea:[0,0,1,0.1], sno:[0,0,0.06,1],
      cloud: [0.55,0.4,0.5,0.85],
      nTop:  ['#0b1442','#0d1a4e','#180f38','#0a1230'],
      nBot:  ['#2a3a72','#33477f','#3d2a58','#243456'],
      nLight:['#8fa8e0','#9ab4e8','#8f8ad0','#a8bce0'],
      duskT: ['#d96a4a','#e07a44','#c2482f','#8a5a6a'],
      duskB: ['#f6c07a','#f6cf8a','#e08a5a','#c2a0a8'],
    };
    const _a=new THREE.Color(), _b=new THREE.Color();
    function idx(ph){ const f=ph*4; const a=Math.floor(f)%4; return [a,(a+1)%4,f-Math.floor(f)]; }
    function num(arr,ph){ const [a,b,s]=idx(ph); return arr[a]+(arr[b]-arr[a])*s; }
    function col(arr,ph,out){ const [a,b,s]=idx(ph); _a.set(arr[a]); _b.set(arr[b]); return out.copy(_a).lerp(_b,s); }

    const _c1=new THREE.Color();
    g.userData.up=(t)=>{ const le=Math.max(0,t-sceneStart[i]);
      /* years accelerate: the first spring lingers, then time runs */
      const yrs=le<1.2?0:Math.pow((le-1.2)*0.155,1.30);
      const ph=yrs%1;

      /* ── day and night turn faster than the seasons ── */
      const dayC=yrs*1.0;
      const nRaw=Math.sin(dayC*TAU-Math.PI/2)*0.5+0.5;
      const night=nRaw*nRaw*(3-2*nRaw);
      const dusk=1-Math.abs(night*2-1);

      /* sky: season colour → dusk warmth → night */
      const sT=col(K.skyTop,ph,new THREE.Color()), sB=col(K.skyBot,ph,new THREE.Color());
      const dT=col(K.duskT,ph,new THREE.Color()), dB=col(K.duskB,ph,new THREE.Color());
      const nT=col(K.nTop,ph,new THREE.Color()), nB=col(K.nBot,ph,new THREE.Color());
      sT.lerp(dT,dusk*0.65); sB.lerp(dB,dusk*0.75);
      sT.lerp(nT,night); sB.lerp(nB,night);
      skyMat.uniforms.top.value.copy(sT); skyMat.uniforms.bot.value.copy(sB);
      sky.position.copy(camera.position);
      starsN.position.copy(camera.position); mwGroup.position.copy(camera.position);
      starMatN.opacity=night*0.95; mwMat.opacity=night*0.75;
      mwGlow.forEach((s,k)=>{ s.material.opacity=night*0.10; });
      mwGroup.rotation.y=t*0.004;
      /* the moon rides across the night */
      const ma=dayC*TAU-Math.PI/2;
      moon.position.set(camera.position.x+Math.cos(ma+2.4)*620, camera.position.y+Math.max(-200,Math.sin(ma+2.4)*420+120), camera.position.z-560);
      moonHalo.position.copy(moon.position);
      moon.material.opacity=night; moonHalo.material.opacity=night*0.35;

      /* light: warm day → amber dusk → cool moonlight */
      col(K.lightC,ph,_c1);
      const dC=new THREE.Color('#ff9a5a'), nC=col(K.nLight,ph,new THREE.Color());
      _c1.lerp(dC,dusk*0.6); _c1.lerp(nC,night);
      keyL.color.copy(_c1); keyL.intensity=num(K.lightI,ph)*(1-night*0.80);
      hemi.intensity=num(K.hemiI,ph)*(1-night*0.62);
      hemi.color.set(0xcfe6ff).lerp(new THREE.Color('#6f84c8'),night);
      col(K.ground,ph,_c1); lawnMat.color.copy(_c1);
      col(K.far,ph,_c1); farCanopies.forEach(m2=>m2.material.color.copy(_c1));
      const cl=num(K.cloud,ph); const cloudTint=new THREE.Color(0xffffff).lerp(new THREE.Color('#ff9e6a'),dusk*0.7).lerp(new THREE.Color('#48588f'),night);
      clouds.forEach((s)=>{ s.material.opacity=cl*(1-night*0.45); s.material.color.copy(cloudTint); });
      const sa=dayC*TAU-Math.PI/2;
      sunSp.position.set(camera.position.x+Math.cos(sa)*620, camera.position.y+Math.sin(sa)*430+60, camera.position.z-540);
      sunSp.material.opacity=(0.85-num([0,0,0.2,0.55],ph))*(1-night);
      sunSp.material.color.set(0xfff6dc).lerp(new THREE.Color('#ff8a4a'),dusk*0.8);

      /* beds bloom and fade with the year */
      const bd=num(K.bed,ph); const dim=1-night*0.72;
      beds.forEach(b=>{ b.pts.material.size=b.base*Math.max(0.001,bd); b.pts.visible=bd>0.02;
        b.pts.material.color.setScalar(dim); });

      /* the trees dress and undress */
      const lc=col(K.leaf,ph,new THREE.Color()), bc=col(K.blos,ph,new THREE.Color());
      const lsc=num(K.leafSc,ph), bsc=num(K.blosSc,ph), blo=num(K.bloom,ph);
      const grow=Math.min(1,yrs/6);
      sapling.tr.scale.setScalar(0.55+grow*1.42);
      [great,far,sapling].forEach((T,ti)=>{
        T.leafT.forEach(m2=>{ m2.material.color.copy(lc); m2.scale.copy(m2.userData.bs).multiplyScalar(Math.max(0.001,lsc)); });
        T.blosT.forEach(m2=>{ m2.material.color.copy(bc); m2.scale.copy(m2.userData.bs).multiplyScalar(Math.max(0.001,bsc)); });
        T.blooms.forEach(s=>{ s.material.opacity=blo*0.92; });
        T.trunkG.rotation.z=Math.sin(t*0.35+ti)*0.012; });

      /* petals, leaves, snow — each falls in its season */
      const wP=num(K.pet,ph), wL=num(K.lea,ph), wS=num(K.sno,ph);
      function drift(arr,w,fallTop,fallLen,swirl){
        if(w<0.02){ arr.forEach(s=>s.material.opacity=0); return; }
        arr.forEach(s=>{ const u=s.userData; const cyc=((t*u.sp+u.off)%1);
          s.position.set(u.x+Math.sin(t*0.6+u.off*9)*swirl, fallTop-cyc*fallLen, u.z+Math.cos(t*0.4+u.off*7)*swirl*0.6);
          u.rot+=u.rs*0.02; s.material.rotation=u.rot;
          s.material.opacity=w*0.9*Math.min(1,(1-cyc)*3)*(1-night*0.45); }); }
      drift(petals,wP,20,26,1.8); drift(leaves,wL,20,26,2.4); drift(snow,wS,22,28,1.0);

      /* butterflies keep the warm months company */
      const bf=num([0.95,1,0.35,0],ph)*clamp01(le/1.2)*(1-night);
      flut.forEach((b,k)=>{ const u=b.userData; const a2=t*u.spd+u.ph;
        const rr2=u.rad*(1+0.14*Math.sin(t*0.6+u.ph));
        b.position.set(4.5+Math.cos(a2)*rr2, -2.4+u.yb+Math.sin(t*0.9+u.yOff)*u.ySw, 2.0+Math.sin(a2)*rr2*0.85);
        b.rotation.set(u.tilt,-a2,Math.sin(t*1.3+k)*0.18);
        const fl2=Math.sin(t*10+k*1.7)*0.92; u.w1.rotation.x=fl2; u.w2.rotation.x=-fl2;
        u.w1.material.opacity=bf*0.95; u.w2.material.opacity=bf*0.95;
        u.gl.material.opacity=bf*(0.28+0.13*Math.sin(t*2.2+k)); });
      const ff=night*num([0.9,1,0.5,0.12],ph);
      fireflies.forEach((s,k)=>{ const u=s.userData;
        s.position.set(u.cx+Math.sin(t*u.a1+u.p1)*u.rx, -2.4+u.cy+Math.sin(t*u.a2+u.p2)*u.ry, u.cz+Math.sin(t*u.a3+u.p3)*u.rz);
        s.material.opacity=ff*(0.35+0.6*Math.pow(Math.max(0,Math.sin(t*u.pw+u.p1)),2)); }); };
  }

  for(let pi=0;pi<FRAMES_PER_STAGE;pi++) makeMemory(i,pi,A,scn);
});

/* ══════════════════════════════════════════════════════════════════════
   NAVIGATION — one step per gesture
   ══════════════════════════════════════════════════════════════════════ */
let current=0, posF=0, started=false, lastStep=-9;
const FLIGHT=2.1;
let tw={from:0,to:0,start:0,dur:FLIGHT,active:false};
const clock=new THREE.Clock();
function easeInOut(x){ return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,4)/2; }
function goTo(i){ i=Math.max(0,Math.min(N,i)); current=i; const clamped=Math.min(i,N-1);
  tw={from:posF,to:clamped,start:clock.getElapsedTime(),dur:FLIGHT,active:true}; updateNav();
  if(i<N){ announce(clamped); sceneStart[clamped]=clock.getElapsedTime()+(posF===clamped?0:FLIGHT); if(MILESTONES[clamped].scene==='bigbang'||MILESTONES[clamped].scene==='life') setTimeout(flash,(posF===clamped?0:FLIGHT*1000)); }
  document.getElementById('finale').classList.toggle('on', i===N);
}
function step(d){ const now=clock.getElapsedTime(); if(now-lastStep<0.62) return; lastStep=now; goTo(current+d); }
let wLock=false, wTimer;
addEventListener('wheel',e=>{ if(!started)return; clearTimeout(wTimer); wTimer=setTimeout(()=>{wLock=false;},260); if(wLock)return; wLock=true; step(e.deltaY>0?1:-1); },{passive:true});
addEventListener('keydown',e=>{ if(document.getElementById('show').classList.contains('on'))return; if(e.repeat)return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' ')step(1); if(e.key==='ArrowUp'||e.key==='ArrowLeft')step(-1); });
document.getElementById('navPrev').onclick=()=>step(-1); document.getElementById('navNext').onclick=()=>step(1);

const dotsNav=document.getElementById('dotsNav');
MILESTONES.forEach((m,i)=>{ const b=document.createElement('b'); b.title=m.title; b.onclick=()=>{ if(started) goTo(i); }; dotsNav.appendChild(b); });
function updateNav(){ [...dotsNav.children].forEach((b,i)=>b.classList.toggle('on', i===Math.min(current,N-1))); document.getElementById('navPrev').disabled=(current<=0); document.getElementById('navNext').disabled=(current>=N); }

const ann=document.getElementById('announce'), hud=document.getElementById('hud');
function announce(i){ const m=MILESTONES[i]; ann.classList.remove('on'); hud.classList.remove('on');
  setTimeout(()=>{ document.getElementById('aEra').textContent=m.era; document.getElementById('aTitle').textContent=m.title; ann.classList.add('on');
    document.getElementById('hStory').textContent=m.subtitle; document.getElementById('hExplain').textContent=m.explanation; hud.classList.add('on'); },260);
  setTimeout(()=>ann.classList.remove('on'), 3400);
}
function flash(){ if(reduce)return; const f=document.createElement('div'); f.style.cssText='position:fixed;inset:0;z-index:22;background:#fff;opacity:0;pointer-events:none;transition:opacity .1s ease';
  document.body.appendChild(f); requestAnimationFrame(()=>{ f.style.opacity='.42'; setTimeout(()=>{ f.style.transition='opacity .8s ease'; f.style.opacity='0'; setTimeout(()=>f.remove(),850); },110); }); }

document.getElementById('finTitle').textContent=FINALE.title; document.getElementById('finText').textContent=FINALE.text;
document.getElementById('replayBtn').onclick=()=>goTo(0);

const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2(); const mouse=new THREE.Vector2();
let down=false, dragging=false, downX=0, downY=0, hovered=null;
renderer.domElement.addEventListener('pointerdown',e=>{ down=true; dragging=false; downX=e.clientX; downY=e.clientY; pointerPx.x=e.clientX; pointerPx.y=e.clientY; });
renderer.domElement.addEventListener('pointermove',e=>{ mouse.x=(e.clientX/innerWidth-0.5); mouse.y=(e.clientY/innerHeight-0.5); ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1; pointerPx.x=e.clientX; pointerPx.y=e.clientY;
  if(down && (Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY))>10) dragging=true; });
addEventListener('pointerup',e=>{ if(down && started){ if(dragging){ const dy=e.clientY-downY; if(Math.abs(dy)>50) step(dy<0?1:-1); } else tryOpen(); } down=false; });
function tryOpen(){
  let best=null,bd=1e9;
  for(const st of memSites){ if(st.vis<0.2||st.sx<-900) continue;
    const d=Math.hypot(st.sx-pointerPx.x, st.sy-pointerPx.y); if(d<bd){ bd=d; best=st; } }
  if(best && bd<150 && best.f>0.25) openShow(best.mi,best.pi,best.sx,best.sy);
}

/* ══════════════════════════════════════════════════════════════════════
   RENDER LOOP
   ══════════════════════════════════════════════════════════════════════ */
const _dir=new THREE.Vector3(), _right=new THREE.Vector3(), _upv=new THREE.Vector3(), _p=new THREE.Vector3(), camP=new THREE.Vector3(), lookP=new THREE.Vector3();
function lerpA(arr,a,b,s){ return arr[a]+(arr[b]-arr[a])*s; }

function animate(){
  requestAnimationFrame(animate); const t=clock.getElapsedTime();
  if(tw.active){ const k=Math.min(1,(t-tw.start)/tw.dur); posF=tw.from+(tw.to-tw.from)*easeInOut(k); if(k>=1){ posF=tw.to; tw.active=false; } }
  document.getElementById('rail').style.width=((N>1?Math.min(current,N-1)/(N-1):0)*100)+'%';

  const a=Math.floor(posF), b=Math.min(a+1,N-1), s=easeInOut(posF-a);
  camP.copy(station[a]).lerp(station[b],s); lookP.copy(anchors[a]).lerp(anchors[b],s);
  camera.position.set(camP.x+mouse.x*5, camP.y-mouse.y*3.5, camP.z);
  camera.lookAt(lookP.x+mouse.x*3, lookP.y+3-mouse.y*2.5, lookP.z);

  for(const o of bgFollow) o.position.copy(camera.position);
  const starW=lerpA(BG.star,a,b,s), galW=lerpA(BG.gal,a,b,s), eW=lerpA(BG.eSky,a,b,s), gW=lerpA(BG.gSky,a,b,s), dW=lerpA(BG.dSky,a,b,s);
  starMatA.opacity=starW*0.95; starMatB.opacity=starW*0.7;
  galSprites.forEach((sp,i)=>sp.material.opacity=galW*(0.35+0.25*Math.sin(t*0.15+i))); galGroup.rotation.y=t*0.008;
  earthDome.material.opacity=eW; gardenDome.material.opacity=gW; dawnDome.material.opacity=dW;
  const cloudW=Math.max(eW,Math.max(gW,dW)); const cTint=dW>0.4?0xffd2a8:0xffffff;
  cloudSprites.forEach((sp)=>{ sp.material.opacity=cloudW*(sp.userData.low?0.85:0.5); sp.material.color.setHex(cTint); }); cloudGroup.rotation.y=t*0.004;
  sunEarth.material.opacity=eW*0.85; sunGarden.material.opacity=gW*0.9;
  stratus.forEach((sp,i3)=>{ sp.material.opacity=(gW+eW)*(0.10+0.04*Math.sin(t*0.1+i3))+dW*(0.26+0.08*Math.sin(t*0.1+i3)); });
  horizonHaze.material.opacity=eW*0.14+gW*0.16+dW*0.3;
  birds.forEach((b,i3)=>{ const u=b.userData; const bx=((u.bx+t*7+i3*9)%520)-260;
    b.position.set(bx, u.by+Math.sin(t*0.9+u.ph)*4, u.bz); b.material.opacity=gW*0.5+dW*0.6; });
  ambient.intensity=0.55+eW*0.5+gW*0.55+dW*0.35; sunLight.intensity=1.8-cloudW*0.4;
  /* lighting adapts to atmosphere scenes */

  for(let i2=0;i2<N;i2++){ const near=Math.max(0,1-Math.abs(posF-i2)/1.15); const sc=easeInOut(Math.min(1,near*1.15)); const gg2=mGroups[i2];
    if(gg2.userData.rise){ gg2.visible=sc>0.03; gg2.scale.setScalar(1); gg2.position.y=anchors[i2].y-(1-sc)*70; }
    else gg2.scale.setScalar(sc<0.02?0.001:sc);
    if(gg2.userData.up && sc>0.02) gg2.userData.up(t); }

  /* ══ the firefly leads, and the world's dust gathers into a photograph ══ */
  const pxW=innerWidth, pxH=innerHeight, cur_mi=Math.round(posF);
  let bestM=null, bestD=1e9;
  for(const st of memSites) st.guided=0;
  const here=memSites.filter(s=>s.mi===cur_mi && Math.abs(posF-s.mi)<0.55);
  if(here.length){
    if(guide.mi!==cur_mi){ guide.mi=cur_mi; guide.idx=0; guide.since=t;
      guide.pos.copy(here[0].grp.position).add(new THREE.Vector3(9,6,9)); }
    if(t-guide.since>8.5){ guide.idx=(guide.idx+1)%here.length; guide.since=t; }
    const tgtS=here[guide.idx];
    guide.tgt.copy(tgtS.grp.position);
    guide.tgt.x+=Math.sin(t*0.9+1)*2.0; guide.tgt.y+=Math.sin(t*1.15)*1.4+1.4; guide.tgt.z+=Math.cos(t*0.8)*1.8;
    guide.pos.lerp(guide.tgt,0.018);
    tgtS.guided=clamp01(1-guide.pos.distanceTo(tgtS.grp.position)/7.5);
    guide.sprite.position.copy(guide.pos); guide.halo.position.copy(guide.pos);
    const gp=0.55+0.45*Math.pow(Math.max(0,Math.sin(t*3.1)),2);
    guide.sprite.material.opacity=gp; guide.halo.material.opacity=gp*0.28;
    for(let k=guide.trail.length-1;k>0;k--) guide.trail[k].p.copy(guide.trail[k-1].p);
    guide.trail[0].p.copy(guide.pos);
    guide.trail.forEach((tr,k)=>{ tr.s.position.copy(tr.p); tr.s.material.opacity=gp*0.3*(1-k/guide.trail.length); });
  } else { guide.sprite.material.opacity=0; guide.halo.material.opacity=0; guide.trail.forEach(tr=>tr.s.material.opacity=0); }

  for(const st of memSites){
    const vis=Math.max(0,1-Math.abs(posF-st.mi)/0.55); st.vis=vis;
    const on=vis>0.02; st.grp.visible=on;
    if(!on){ st.sx=-999; continue; }
    st.grp.quaternion.copy(camera.quaternion);
    _p.copy(st.grp.position).project(camera);
    let d=1e9;
    if(_p.z<1 && Math.abs(_p.x)<1.4 && Math.abs(_p.y)<1.4){
      st.sx=(_p.x*0.5+0.5)*pxW; st.sy=(-_p.y*0.5+0.5)*pxH;
      d=Math.hypot(st.sx-pointerPx.x, st.sy-pointerPx.y);
      if(d<bestD){ bestD=d; bestM=st; }
    } else st.sx=-999;
    const byPointer=clamp01(1-d/260);
    const want=Math.max(byPointer*byPointer, st.guided);
    st.f+=(want-st.f)*0.05; const f=st.f;
    const posAttr=st.pts.geometry.attributes.position, a2=st.cur;
    const swirl=(1-f)*2.4, ez=f<0.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    for(let k=0;k<st.NP;k++){ const o=k*3;
      const ang=swirl*(1.2+((k%7)*0.16))+t*0.25*(1-f);
      const cs=Math.cos(ang), sn=Math.sin(ang);
      const fx=st.fm[o], fy=st.fm[o+1];
      const rx=fx*cs-fy*sn, ry=fx*sn+fy*cs;
      const wob=(1-f)*Math.sin(t*1.4+k)*0.5;
      a2[o]  += ((st.sc[o]  +(rx-st.sc[o])*ez)+wob - a2[o])*0.15;
      a2[o+1]+= ((st.sc[o+1]+(ry-st.sc[o+1])*ez)+wob*0.7 - a2[o+1])*0.15;
      a2[o+2]+= ((st.sc[o+2]+(st.fm[o+2]-st.sc[o+2])*ez) - a2[o+2])*0.15; }
    posAttr.needsUpdate=true;
    /* while the dust is scattered, quietly swap in another photo from the stage */
    const pool=MILESTONES[st.mi].pool;
    if(pool.length>1 && (f<0.12 || st.sx<-900) && t>st.nextSwap){
      const taken=memSites.filter(o=>o!==st && o.mi===st.mi).map(o=>o.idx);
      let n=st.idx, tries=0;
      do { n=Math.floor(Math.random()*pool.length); tries++; }
      while(tries<24 && (n===st.idx || taken.includes(n)));
      st.idx=n; st.plane.material.map=photoTex(pool[n].src); st.plane.material.needsUpdate=true;
      st.nextSwap=t+ROTATE_EVERY*(0.75+Math.random()*0.7);
    }
    const breath=0.5+0.5*Math.sin(t*st.rate+st.ph);
    st.pts.material.opacity=vis*(0.055+breath*0.035+f*0.5)*(1-clamp01((f-0.6)/0.34));
    st.pts.material.size=st.baseSize*(1+(1-f)*0.45);
    const ph2=clamp01((f-0.55)/0.4);
    st.plane.material.opacity=vis*ph2; st.frame.material.opacity=vis*ph2*0.5;
  }
  hoveredMem=(bestM && bestD<130 && bestM.f>0.3)?bestM:null;
  renderer.domElement.style.cursor=hoveredMem?'pointer':'default';

  composer.render();
}
animate();

/* ══════════════════════════════════════════════════════════════════════
   SLIDESHOW
   ══════════════════════════════════════════════════════════════════════ */
const show=document.getElementById('show'), showStage=document.getElementById('showStage'), showDots=document.getElementById('showDots'), showEra=document.getElementById('showEra');
let curSlide=0, curPhotos=[], autoTimer=null;
function openShow(mi,pi){ const m=MILESTONES[mi]; curPhotos=m.pool||m.photos;
  const site=memSites.find(s=>s.mi===mi && s.pi===pi);
  curSlide=Math.min(curPhotos.length-1, Math.max(0, site?site.idx:(pi||0)));
  showEra.textContent=m.subtitle;
  showStage.querySelectorAll('.slide,.nav2').forEach(n=>n.remove());
  curPhotos.forEach((p,idx)=>{ const sl=document.createElement('div'); sl.className='slide'+(idx===curSlide?' cur':'');
    /* only the first few load eagerly — the rest arrive as she scrolls */
    const capHtml=(p.caption||p.dateLabel)
      ? `<div class="cap">${p.caption||''}${p.dateLabel?`<span class="when">${p.dateLabel}</span>`:''}</div>` : '';
    sl.innerHTML=`<img loading="lazy" src="${p.src}" alt="${p.caption||''}" onerror="this.style.opacity=.12;console.warn('photo failed to load:',decodeURIComponent(this.getAttribute('src')))"/>${capHtml}`;
    showStage.appendChild(sl); });
  const pv=document.createElement('button'); pv.className='nav2 prev'; pv.innerHTML='‹'; pv.onclick=e=>{e.stopPropagation();go(-1);};
  const nx=document.createElement('button'); nx.className='nav2 next'; nx.innerHTML='›'; nx.onclick=e=>{e.stopPropagation();go(1);}; showStage.appendChild(pv); showStage.appendChild(nx);
  /* a scrollable strip of everything in this stage */
  showDots.innerHTML='';
  const strip=document.createElement('div'); strip.className='strip';
  curPhotos.forEach((p,idx)=>{ const th=document.createElement('button'); th.type='button';
    th.className='sthumb'+(idx===curSlide?' on':'');
    const im=document.createElement('img'); im.loading='lazy'; im.src=p.src; im.alt='';
    th.appendChild(im); th.onclick=e=>{e.stopPropagation();set(idx);}; strip.appendChild(th); });
  showDots.appendChild(strip);
  const cnt=document.createElement('div'); cnt.className='counter'; cnt.id='showCount'; showDots.appendChild(cnt);
  updateCounter(); scrollThumbIntoView();
  show.classList.add('on'); }
function updateCounter(){ const c=document.getElementById('showCount');
  if(!c) return; const p=curPhotos[curSlide]||{};
  const first=curPhotos[0]&&curPhotos[0].dateLabel, last=curPhotos[curPhotos.length-1]&&curPhotos[curPhotos.length-1].dateLabel;
  const span=(first&&last&&first!==last)?`  ·  ${first} → ${last}`:'';
  c.textContent=(curSlide+1)+' / '+curPhotos.length+(p.dateLabel?'  ·  '+p.dateLabel:'')+span; }
function scrollThumbIntoView(){ const th=showDots.querySelectorAll('.sthumb')[curSlide];
  if(th && th.scrollIntoView) th.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
function set(idx){ const sl=showStage.querySelectorAll('.slide'); const th=showDots.querySelectorAll('.sthumb');
  if(!sl.length) return;
  sl[curSlide].classList.remove('cur'); if(th[curSlide]) th[curSlide].classList.remove('on');
  curSlide=(idx+curPhotos.length)%curPhotos.length;
  sl[curSlide].classList.add('cur'); if(th[curSlide]) th[curSlide].classList.add('on');
  updateCounter(); scrollThumbIntoView(); }
function go(d){ set(curSlide+d); }
function closeShow(){ show.classList.remove('on'); stopAuto(); }
document.getElementById('showX').onclick=closeShow; show.addEventListener('click',e=>{ if(e.target===show) closeShow(); });
const autoBtn=document.getElementById('showAuto'); autoBtn.onclick=()=>{ autoTimer?stopAuto():startAuto(); };
function startAuto(){ autoBtn.textContent='❚❚ Pause'; autoTimer=setInterval(()=>go(1),3200); }
function stopAuto(){ autoBtn.textContent='▶ Auto-play'; clearInterval(autoTimer); autoTimer=null; }
addEventListener('keydown',e=>{ if(!show.classList.contains('on'))return; if(e.key==='Escape')closeShow(); if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1); });
showStage.addEventListener('wheel',e=>{ if(!show.classList.contains('on'))return;
  e.preventDefault(); if(Math.abs(e.deltaY)>4||Math.abs(e.deltaX)>4) go((e.deltaY+e.deltaX)>0?1:-1); },{passive:false});
let sx=0; showStage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
showStage.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) go(dx<0?1:-1); },{passive:true});

/* boot */
const beginBtn=document.getElementById('beginBtn'); beginBtn.disabled=false; beginBtn.textContent='Ignite the universe ✦'; document.getElementById('loading').style.display='none'; updateNav();
beginBtn.addEventListener('click',()=>{ document.getElementById('intro').classList.add('gone'); started=true; sceneStart[0]=clock.getElapsedTime(); announce(0); flash(); updateNav(); });
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); bloom.setSize(innerWidth,innerHeight); });
</script>
</body>
